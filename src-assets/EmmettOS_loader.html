const REPO   = "YOUR_REPO";
const BRANCH = "main";          // or a tag / commit hash (pinning a hash avoids stale CDN cache)
const FOLDER = "";              // e.g. "emmettos/" if the parts live in a subfolder (keep trailing slash)
/* ================================================================== */

const PARTS = [
  ["EmmettOS.part1.bin", 19491024],
  ["EmmettOS.part2.bin", 19491024],
  ["EmmettOS.part3.bin", 19491024],
  ["EmmettOS.part4.bin", 19491024],
  ["EmmettOS.part5.bin", 19491022]
];
const HOSTS = ["cdn.jsdelivr.net", "fastly.jsdelivr.net", "gcore.jsdelivr.net"];
const TOTAL = PARTS.reduce((s, p) => s + p[1], 0);
const CACHE = "emmettos-parts-v1";

const $ = id => document.getElementById(id);
const done = new Array(PARTS.length).fill(0);
$("parts").innerHTML = PARTS.map(() => "<span><i></i></span>").join("");
const segs = [...$("parts").children];

function render(msg) {
  const got = done.reduce((a, b) => a + b, 0);
  const p = Math.min(100, got / TOTAL * 100);
  $("bar").style.width = p + "%";
  $("pct").textContent = p.toFixed(0) + "%  ·  " + (got / 1048576).toFixed(1) + " / " + (TOTAL / 1048576).toFixed(1) + " MB";
  segs.forEach((s, i) => { s.firstChild.style.width = Math.min(100, done[i] / PARTS[i][1] * 100) + "%"; });
  if (msg) $("st").textContent = msg;
}

const urlFor = (host, name) => `https://${host}/gh/${USER}/${REPO}@${BRANCH}/${FOLDER}${name}`;

async function readStream(res, i) {
  const reader = res.body.getReader(), chunks = [];
  let n = 0;
  for (;;) {
    const { done: d, value } = await reader.read();
    if (d) break;
    chunks.push(value); n += value.length;
    done[i] = n; render();
  }
  return new Blob(chunks);
}

async function getPart(i) {
  const [name, size] = PARTS[i];
  let cache = null;
  try { cache = await caches.open(CACHE); } catch (e) {}
  if (cache) {
    try {
      const hit = await cache.match("/__emmettos/" + name);
      if (hit) {
        const b = await hit.blob();
        if (b.size === size) { done[i] = size; render(); return b; }
      }
    } catch (e) {}
  }
  let lastErr;
  for (let attempt = 0; attempt < HOSTS.length * 2; attempt++) {
    const host = HOSTS[attempt % HOSTS.length];
    try {
      done[i] = 0; render(`Downloading part ${i + 1} of ${PARTS.length}…` + (attempt ? ` (retry via ${host})` : ""));
      const res = await fetch(urlFor(host, name), { mode: "cors" });
      if (!res.ok) throw new Error("HTTP " + res.status + " from " + host);
      const blob = await readStream(res, i);
      if (blob.size !== size) throw new Error(`part ${i + 1}: got ${blob.size} bytes, expected ${size}`);
      if (cache) { try { await cache.put("/__emmettos/" + name, new Response(blob)); } catch (e) {} }
      return blob;
    } catch (e) { lastErr = e; await new Promise(r => setTimeout(r, 600)); }
  }
  throw lastErr;
}

async function boot() {
  $("retry").style.display = "none";
  segs.forEach(s => s.className = "");
  done.fill(0); render("Contacting jsDelivr…");
  if (USER === "YOUR_USER") { $("st").textContent = "Set USER / REPO at the top of this file first."; $("retry").style.display = "inline-block"; return; }
  try {
    const blobs = [];
    for (let i = 0; i < PARTS.length; i++) {
      try { blobs.push(await getPart(i)); segs[i].className = "ok"; }
      catch (e) { segs[i].className = "err"; throw e; }
    }
    render("Assembling EmmettOS…");
    const page = new Blob(blobs, { type: "text/html;charset=utf-8" });
    blobs.length = 0;
    render("Launching…");
    location.replace(URL.createObjectURL(page));
  } catch (e) {
    console.error(e);
    $("st").textContent = "Download failed: " + (e && e.message || e);
    $("retry").style.display = "inline-block";
  }
}
$("retry").onclick = boot;
boot();
</script>
</body>
</html>
